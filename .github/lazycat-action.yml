version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/buzz.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: relay
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: relay
    target: service
    service: relay
    source: ghcr.io/block/buzz
    channel: custom
    sort: created
    tag_regex: '^main$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Buzz
      source: https://github.com/block/buzz
      source_author: block
  private:
    enabled: true
    skip_if_version_exists: false
