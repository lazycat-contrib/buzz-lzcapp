version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/buzz.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: relay
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: relay
    target: service
    service: relay
    source: ghcr.io/block/buzz
    channel: custom
    sort: created
    tag_regex: '^main$'
    delivery:
      mode: mirror
      image_template: ghcr.1ms.run/block/buzz:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
